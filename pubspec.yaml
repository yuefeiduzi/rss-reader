name: rss_reader
description: A multi-platform RSS reader with offline support

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # RSS 解析
  webfeed_plus: ^1.1.2

  # HTTP 请求
  dio: ^5.3.0

  # HTML 解析（全文抓取）
  html: ^0.15.4

  # 本地存储
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0

  # 状态管理
  provider: ^6.0.5

  # UI
  cached_network_image: ^3.2.3
  # 外部链接和分享
  url_launcher: ^6.2.0
  share_plus: ^9.0.0

  # 文件选择
  file_picker: ^8.0.0

  # 压缩
  archive: ^3.6.1
  flutter_widget_from_html_core: ^0.17.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# 临时绕开上游断裂。
# objective_c 9.6.1（2026-09-15 发布）仍引用 code_assets 2.0.0 已删除的
# Architecture.arm64e，属上游断裂，锁到 9.6.0。
#
# （原有的 html: 0.15.4 是为了迁就已停更的 flutter_html 3.0.0，它违规
#   import 了 html 包的私有文件；渲染引擎迁到 flutter_widget_from_html_core
#   后冲突消失，该条已移除。）
dependency_overrides:
  objective_c: 9.6.0
